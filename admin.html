<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Panel | KisanValley</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="kv-theme.css" />
</head>
<body class="kv-site min-h-screen">
  <header class="kv-shell-header">
    <div class="kv-shell-inner">
      <div class="kv-shell-row">
        <a href="index.html" class="kv-brand">
          <img src="images/kv.png" alt="KisanValley Logo">
          <span>
            <span class="kv-brand-title">KisanValley Admin</span>
            <span class="kv-brand-subtitle">Product management</span>
          </span>
        </a>
        <nav class="kv-shell-nav">
          <a href="index.html">Back to Website</a>
          <a href="index.html#products">Products</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="kv-page-hero">
      <div class="mx-auto max-w-5xl px-4 py-14 sm:px-6 lg:px-8">
        <p class="inline-flex rounded-full bg-white/12 px-4 py-2 text-sm font-bold text-green-50 ring-1 ring-white/20">Admin panel</p>
        <h1 class="mt-5 text-4xl font-black tracking-tight sm:text-5xl">Manage storefront products.</h1>
        <p class="mt-5 max-w-2xl text-lg leading-8 text-green-50">Add local products for testing and preview them in the storefront catalog.</p>
      </div>
    </section>

    <section class="mx-auto grid max-w-5xl gap-8 px-4 py-10 sm:px-6 lg:px-8">
      <div class="rounded-3xl bg-white p-6 shadow-soft ring-1 ring-slate-200">
        <p class="text-sm font-black uppercase tracking-[0.2em] text-field-600">Add product</p>
        <h2 class="mt-2 text-2xl font-black text-slate-950">New product details</h2>
        <form id="productForm" class="mt-6 grid gap-4 md:grid-cols-2">
          <input type="text" id="productName" placeholder="Product Name" class="field" required />
          <input type="number" id="productPrice" placeholder="Price in rupees" class="field" required />
          <select id="productCategory" class="field" required>
            <option value="">Select Category</option>
            <option value="weeder-tiller">Weeders and Tillers</option>
            <option value="brush-cutter">Brush Cutters</option>
            <option value="sprayer">Sprayers</option>
            <option value="earth-auger">Earth Augers</option>
            <option value="water-pump">Water Pumps</option>
            <option value="chainsaw">Chainsaws</option>
          </select>
          <input type="file" id="productImage" accept="image/*" class="field" required />
          <button type="submit" class="min-h-[52px] rounded-full bg-field-700 px-5 text-sm font-extrabold text-white hover:bg-field-900 md:col-span-2">Add Product</button>
        </form>
      </div>

      <div class="rounded-3xl bg-white p-6 shadow-soft ring-1 ring-slate-200">
        <p class="text-sm font-black uppercase tracking-[0.2em] text-field-600">Current products</p>
        <h2 class="mt-2 text-2xl font-black text-slate-950">Local admin products</h2>
        <div id="adminProductList" class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 md:grid-cols-3"></div>
      </div>
    </section>
  </main>

  <script>
    window.KV_SKIP_LAYOUT = true;
  </script>
  <script src="kv-layout.js"></script>
  <script>
    const form = document.getElementById("productForm");
    const nameInput = document.getElementById("productName");
    const priceInput = document.getElementById("productPrice");
    const categoryInput = document.getElementById("productCategory");
    const imageInput = document.getElementById("productImage");
    const listContainer = document.getElementById("adminProductList");

    let productList = JSON.parse(localStorage.getItem("products")) || [];

    function renderAdminList() {
      listContainer.innerHTML = "";

      if (productList.length === 0) {
        listContainer.innerHTML = `<p class="col-span-full rounded-2xl bg-slate-50 p-6 text-center text-sm font-bold text-slate-500">No products added yet.</p>`;
        return;
      }

      productList.forEach((product, index) => {
        const card = document.createElement("div");
        card.className = "overflow-hidden rounded-2xl bg-slate-50 shadow-sm ring-1 ring-slate-200";
        card.innerHTML = `
          <img src="${product.image}" alt="${product.name}" class="h-36 w-full object-cover" />
          <div class="p-4">
            <h3 class="text-lg font-black text-slate-950">${product.name}</h3>
            <p class="mt-1 font-black text-field-700">Rs. ${Number(product.price).toLocaleString("en-IN")}</p>
            <p class="mt-2 text-xs font-black uppercase tracking-wide text-slate-500">${product.category || "uncategorized"}</p>
            <button onclick="removeProduct(${index})" class="mt-4 rounded-full bg-red-50 px-4 py-2 text-sm font-extrabold text-red-700 hover:bg-red-100">Remove</button>
          </div>
        `;
        listContainer.appendChild(card);
      });
    }

    function removeProduct(index) {
      productList.splice(index, 1);
      localStorage.setItem("products", JSON.stringify(productList));
      renderAdminList();
    }

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      const file = imageInput.files[0];
      const reader = new FileReader();

      reader.onload = function(event) {
        productList.push({
          name: nameInput.value.trim(),
          price: parseInt(priceInput.value, 10),
          category: categoryInput.value,
          image: event.target.result
        });
        localStorage.setItem("products", JSON.stringify(productList));
        form.reset();
        renderAdminList();
      };

      if (file) reader.readAsDataURL(file);
    });

    renderAdminList();
  </script>
</body>
</html>

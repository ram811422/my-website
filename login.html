<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | KisanValley</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="kv-theme.css" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=GT-NSSMRNNP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'GT-NSSMRNNP');
</script>
</head>
<body class="kv-site min-h-screen">
  <main class="grid min-h-screen lg:grid-cols-[0.95fr_1.05fr]">
    <section class="relative hidden overflow-hidden bg-field-900 text-white lg:block">
      <img src="images/products/bp-700.jpg" alt="Farm machinery" class="absolute inset-0 h-full w-full object-cover opacity-[0.22]" />
      <div class="absolute inset-0 bg-gradient-to-r from-field-900 via-field-900/92 to-field-900/70"></div>
      <div class="relative flex h-full flex-col justify-between p-12">
        <a href="index.html" class="kv-brand" style="color:#fff;">
          <img src="images/kv.png" alt="KisanValley Logo">
          <span>
            <span class="kv-brand-title">KisanValley</span>
            <span class="kv-brand-subtitle" style="color:#dcfce7;">Farm machinery store</span>
          </span>
        </a>
        <div>
          <p class="inline-flex rounded-full bg-white/12 px-4 py-2 text-sm font-bold text-green-50 ring-1 ring-white/20">Customer account</p>
          <h1 class="mt-5 max-w-xl text-5xl font-black tracking-tight">Welcome back to your farm equipment dashboard.</h1>
          <p class="mt-5 max-w-lg text-lg leading-8 text-green-50">Sign in to manage delivery details, continue checkout, and track recent KisanValley orders.</p>
        </div>
      </div>
    </section>

    <section class="flex items-center justify-center px-4 py-10 sm:px-6 lg:px-8">
      <div class="w-full max-w-md rounded-3xl bg-white p-6 shadow-lift ring-1 ring-slate-200 sm:p-8">
        <div class="text-center lg:hidden">
          <a href="index.html" class="inline-flex flex-col items-center">
            <img src="images/kv.png" alt="KisanValley Logo" class="mb-3 h-16 w-16 rounded-xl object-contain" />
          </a>
        </div>
        <p class="text-sm font-black uppercase tracking-[0.2em] text-field-600">Login</p>
        <h1 class="mt-3 text-3xl font-black tracking-tight text-slate-950">Welcome back</h1>
        <p class="mt-2 text-sm leading-6 text-slate-600">Login to your KisanValley account.</p>

        <form id="loginForm" class="mt-6 space-y-4">
          <div>
            <label for="email" class="mb-2 block text-sm font-black text-slate-700">Email</label>
            <input type="email" id="email" class="field" placeholder="you@example.com" required />
          </div>
          <div>
            <label for="password" class="mb-2 block text-sm font-black text-slate-700">Password</label>
            <input type="password" id="password" class="field" placeholder="Your password" required />
          </div>
          <button id="loginButton" type="submit" class="min-h-[52px] w-full rounded-full bg-field-700 px-5 text-sm font-extrabold text-white shadow-soft hover:bg-field-900 disabled:bg-slate-400">
            Login
          </button>
        </form>

        <div id="resultMessage" class="mt-4 hidden rounded-2xl p-4 text-center text-sm font-bold"></div>

        <p class="mt-6 text-center text-sm text-slate-600">
          Don't have an account?
          <a href="signup.html" class="font-black text-field-700 hover:text-field-900">Create one</a>
        </p>
        <p class="mt-3 text-center text-sm">
          <a href="index.html" class="font-bold text-slate-500 hover:text-field-700">Back to store</a>
        </p>
      </div>
    </section>
  </main>

  <script>
    window.KV_SKIP_LAYOUT = true;
  </script>
  <script src="kv-layout.js"></script>
  <script src="auth.js"></script>
  <script>
    const form = document.getElementById("loginForm");
    const result = document.getElementById("resultMessage");
    const loginButton = document.getElementById("loginButton");

    function showMessage(message, isSuccess = false) {
      result.textContent = message;
      result.classList.remove("hidden", "bg-red-50", "text-red-700", "bg-green-50", "text-green-700");
      result.classList.add(isSuccess ? "bg-green-50" : "bg-red-50", isSuccess ? "text-green-700" : "text-red-700");
    }

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      loginButton.disabled = true;
      loginButton.textContent = "Logging in...";

      try {
        await loginCustomer(email, password);
        showMessage("Login successful. Redirecting...", true);
        setTimeout(() => {
          window.location.href = "account.html";
        }, 700);
      } catch (error) {
        showMessage(error.message || "Invalid email or password.");
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = "Login";
      }
    });
  </script>
</body>
</html>

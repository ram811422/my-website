<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wishlist | KisanValley</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="kv-theme.css" />
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=GT-NSSMRNNP"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'GT-NSSMRNNP');
</script>
</head>
<body class="kv-site">
  <header class="kv-shell-header">
    <div class="kv-shell-inner">
      <div class="kv-shell-row">
        <a href="index.html" class="kv-brand">
          <img src="images/kv.png" alt="KisanValley Logo">
          <span>
            <span class="kv-brand-title">KisanValley</span>
            <span class="kv-brand-subtitle">Farm machinery store</span>
          </span>
        </a>
        <nav class="kv-shell-nav">
          <a href="index.html">Home</a>
          <a href="index.html#products">Products</a>
          <a href="track-order.html">Track Order</a>
          <a href="cart.html" class="cart-counter">Cart</a>
        </nav>
      </div>
    </div>
  </header>

  <main>
    <section class="kv-page-hero">
      <div class="mx-auto max-w-7xl px-4 py-14 sm:px-6 lg:px-8 lg:py-16">
        <p class="inline-flex rounded-full bg-white/12 px-4 py-2 text-sm font-bold text-green-50 ring-1 ring-white/20">Saved products</p>
        <h1 class="mt-5 text-4xl font-black tracking-tight sm:text-5xl">Your Wishlist</h1>
        <p class="mt-5 max-w-2xl text-lg leading-8 text-green-50">Save products for later, compare choices, and add them to your cart when you are ready.</p>
      </div>
    </section>

    <section class="mx-auto max-w-7xl px-4 py-10 sm:px-6 lg:px-8">
      <div id="wishlistGrid" class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4"></div>
      <div id="emptyWishlist" class="hidden rounded-3xl border border-dashed border-slate-300 bg-white p-10 text-center shadow-soft">
        <h2 class="text-2xl font-black text-slate-950">Your wishlist is empty</h2>
        <p class="mx-auto mt-2 max-w-md text-sm leading-6 text-slate-600">Save products from any product card or detail page.</p>
        <a href="index.html#products" class="mt-5 inline-flex rounded-full bg-field-700 px-5 py-3 text-sm font-extrabold text-white hover:bg-field-900">Browse Products</a>
      </div>
    </section>
  </main>

  <script src="products.js"></script>
  <script src="cart.js"></script>
  <script src="wishlist.js"></script>
  <script src="auth.js"></script>
  <script>
    const grid = document.getElementById("wishlistGrid");
    const empty = document.getElementById("emptyWishlist");

    function renderWishlist() {
      const products = getWishlist().map(id => allSiteProducts[id]).filter(Boolean);
      if (products.length === 0) {
        grid.innerHTML = "";
        empty.classList.remove("hidden");
        return;
      }

      empty.classList.add("hidden");
      grid.innerHTML = products.map(product => `
        <article class="group overflow-hidden rounded-2xl bg-white shadow-soft ring-1 ring-slate-200 transition hover:-translate-y-1 hover:shadow-lift">
          <a href="${getProductDetailUrl(product.id)}" class="block overflow-hidden bg-slate-100">
            <img src="${product.image}" alt="${product.name}" class="h-56 w-full object-cover transition duration-500 group-hover:scale-105">
          </a>
          <div class="p-5">
            <p class="text-xs font-black uppercase tracking-[0.18em] text-field-600">${(product.category || "farm-equipment").replaceAll("-", " ")}</p>
            <a href="${getProductDetailUrl(product.id)}" class="mt-2 block text-lg font-black leading-6 text-slate-950 hover:text-field-700">${product.name}</a>
            <p class="mt-3 text-2xl font-black text-field-700">Rs. ${Number(product.price).toLocaleString("en-IN")}</p>
            <div class="mt-5 grid gap-2">
              <button onclick="addToCart('${product.id}')" class="rounded-full bg-field-700 px-4 py-3 text-sm font-extrabold text-white hover:bg-field-900">Add to Cart</button>
              <button onclick="toggleWishlist('${product.id}'); renderWishlist();" class="rounded-full border border-slate-200 px-4 py-3 text-sm font-extrabold text-slate-700 hover:border-red-400 hover:text-red-700">Remove</button>
            </div>
          </div>
        </article>
      `).join("");
    }

    renderWishlist();
  </script>
  <script src="kv-layout.js"></script>
</body>
</html>
